# Development stack (hot reload). Panel: http://localhost:5175
# Production: docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build: .
    container_name: openshorts-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      # Server-side API keys, panel password hash and session secret.
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  # Remotion renderer: only the backend talks to it, so no published port.
  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
